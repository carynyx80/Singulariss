[profile.default]
src = "contracts/src"
out = "contracts/out"
libs = ["node_modules"]
solc_version = "0.8.24"
auto_detect_solc = false
optimizer = true
optimizer_runs = 200
via_ir = false

# Production deployment is disabled by default. Testnet only with explicit approval.
[rpc_endpoints]
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
robinhood_mainnet = "https://rpc.mainnet.chain.robinhood.com"
bsc_testnet = "https://data-seed-prebsc-1-s1.bnbchain.org:8545"
bsc_mainnet = "https://bsc-dataseed.bnbchain.org"
